name: guardian_ai
description: Guardian AI Safety Suite — personal safety companion built from Stitch designs.
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  google_maps_flutter: ^2.10.1
  http: ^1.3.0
  geolocator: ^13.0.2
  flutter_contacts: ^1.1.9+2
  flutter_secure_storage: ^9.2.2
  sensors_plus: ^6.1.1
  battery_plus: ^6.1.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.1
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
