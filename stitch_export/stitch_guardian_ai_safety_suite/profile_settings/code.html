<script>
        // Micro-interaction: Profile picture soft pulse effect
        const profileImage = document.querySelector('.pink-glow');
        if (profileImage) {
            setInterval(() => {
                profileImage.style.boxShadow = '0 0 30px rgba(255, 46, 136, 0.5)';
                setTimeout(() => {
                    profileImage.style.boxShadow = '0 0 20px rgba(255, 46, 136, 0.3)';
                }, 1000);
            }, 2000);
        }

        // Handle simple switch toggle visual
        const toggle = document.querySelector('.bg-primary-container');
        toggle?.addEventListener('click', function() {
            const circle = this.querySelector('div');
            if (this.classList.contains('bg-primary-container')) {
                this.classList.remove('bg-primary-container');
                this.classList.add('bg-white/20');
                circle.classList.remove('right-1');
                circle.classList.add('left-1');
            } else {
                this.classList.remove('bg-white/20');
                this.classList.add('bg-primary-container');
                circle.classList.remove('left-1');
                circle.classList.add('right-1');
            }
        });
    </script>
